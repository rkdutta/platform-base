# Pre-commit hooks: catch formatting, obvious mistakes, secrets, and the
# repo's own unit tests BEFORE they reach CI. Install once with
# `pre-commit install`. E2E tests (need a live cluster) are NOT run here —
# see tests/e2e/run.sh, invoked on demand via the capstone-level /test-all
# command.
#
# Rev fields are pinned tags; `pre-commit autoupdate` (or Renovate) bumps them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt (check)
        entry: terraform fmt -check -recursive
        language: system
        types: [terraform]
        pass_filenames: false
      - id: platform-base-unit-tests
        name: platform-base unit tests
        entry: tests/unit/run.sh
        language: system
        pass_filenames: false
